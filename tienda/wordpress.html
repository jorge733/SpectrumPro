<!--
  Código para mostrar la tienda dentro de una página de WordPress (spectrumpro.cl).
  Se pega completo en un widget «HTML» de Elementor (o en un bloque «HTML personalizado»).
  La tienda se ajusta sola de alto y sigue leyendo los productos del panel.
-->
<iframe id="tienda-spectrum" src="https://spectrumpro.vercel.app/tienda/?embed=1" title="Tienda de SpectrumPro" style="display:block;width:100%;height:2400px;border:0;overflow:hidden" scrolling="no"></iframe>
<script>
(function () {
  var marco = document.getElementById('tienda-spectrum');
  var origen = 'https://spectrumpro.vercel.app';
  window.addEventListener('message', function (e) {
    if (e.origin !== origen || e.source !== marco.contentWindow) return;
    var d = e.data || {};
    if (d.tipo === 'spectrum-tienda-alto' && d.alto > 0) marco.style.height = d.alto + 'px';
    if (d.tipo === 'spectrum-tienda-ir') {
      var arriba = marco.getBoundingClientRect().top + window.pageYOffset + (d.y || 0) - 90;
      window.scrollTo({ top: arriba, behavior: 'smooth' });
    }
  });
})();
</script>
